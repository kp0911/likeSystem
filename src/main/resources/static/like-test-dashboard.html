<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Like Flow Dashboard</title>
  <style>
    :root {
      --bg: #f4f6f7;
      --panel: #ffffff;
      --line: #d8e0e4;
      --text: #172026;
      --muted: #62707a;
      --green: #087f5b;
      --red: #c92a2a;
      --blue: #1864ab;
      --amber: #9a6700;
      --teal: #0b7285;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      color: var(--text);
      background: var(--bg);
    }

    main {
      max-width: 1280px;
      margin: 0 auto;
      padding: 28px 20px 40px;
    }

    header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 20px;
    }

    h1 {
      margin: 0;
      font-size: 28px;
      letter-spacing: 0;
    }

    h2 {
      margin: 28px 0 12px;
      font-size: 20px;
      letter-spacing: 0;
    }

    .section-title-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 28px;
    }

    .section-title-row h2 {
      margin: 0 0 12px;
    }

    h3 {
      margin: 0 0 10px;
      font-size: 16px;
      letter-spacing: 0;
    }

    .muted {
      color: var(--muted);
      font-size: 13px;
    }

    .grid {
      display: grid;
      gap: 12px;
    }

    .summary-grid {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    .state-grid {
      grid-template-columns: repeat(6, minmax(0, 1fr));
    }

    .flow-grid {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    .panel,
    .metric,
    .step {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 6px;
    }

    .panel {
      padding: 16px;
    }

    .metric {
      padding: 14px;
      min-height: 88px;
    }

    .metric-label,
    .step-label {
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 8px;
    }

    .metric-value,
    .step-value {
      font-size: 24px;
      font-weight: 700;
      line-height: 1.1;
      word-break: break-word;
    }

    .flow-column {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .flow-visual-grid {
      display: grid;
      gap: 12px;
    }

    .flow-visual {
      display: grid;
      grid-template-columns: 180px 1fr;
      gap: 14px;
      align-items: center;
      min-height: 92px;
    }

    .flow-visual-title {
      font-weight: 700;
    }

    .flow-visual-subtitle {
      color: var(--muted);
      font-size: 12px;
      margin-top: 6px;
    }

    .flow-route {
      display: grid;
      grid-auto-flow: column;
      grid-auto-columns: minmax(88px, 1fr);
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .flow-node {
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 10px 8px;
      background: #f8fafb;
      text-align: center;
      min-height: 54px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .flow-node strong {
      display: block;
      font-size: 13px;
      line-height: 1.2;
    }

    .flow-node span {
      color: var(--muted);
      font-size: 11px;
      margin-top: 4px;
      line-height: 1.2;
    }

    .flow-segment {
      position: relative;
      height: 4px;
      min-width: 32px;
      border-radius: 999px;
      background: #d7e2e7;
      overflow: visible;
    }

    .flow-segment::after {
      content: "";
      position: absolute;
      top: 50%;
      right: -1px;
      width: 7px;
      height: 7px;
      border-right: 2px solid #8aa0ad;
      border-top: 2px solid #8aa0ad;
      transform: translateY(-50%) rotate(45deg);
    }

    .flow-particle {
      position: absolute;
      top: 50%;
      left: 0;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--teal);
      box-shadow: 0 0 0 3px rgba(11, 114, 133, 0.12);
      transform: translate(0, -50%);
      animation: particle-travel 1200ms ease-out forwards;
      pointer-events: none;
      will-change: transform, opacity;
    }

    .flow-particle.sync {
      background: var(--blue);
      box-shadow: 0 0 0 3px rgba(24, 100, 171, 0.12);
    }

    .flow-particle.async-event {
      background: var(--amber);
      box-shadow: 0 0 0 3px rgba(154, 103, 0, 0.14);
    }

    .flow-particle.buffered-async {
      background: var(--green);
      box-shadow: 0 0 0 3px rgba(8, 127, 91, 0.12);
    }

    @keyframes particle-travel {
      0% {
        opacity: 0;
        transform: translate(0, -50%) scale(0.65);
      }
      12% {
        opacity: 1;
      }
      100% {
        opacity: 0;
        transform: translate(var(--travel-x), calc(-50% + var(--travel-y))) scale(1);
      }
    }

    .step {
      padding: 12px;
      min-height: 78px;
    }

    .step-value {
      font-size: 20px;
    }

    .button-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 12px;
    }

    button {
      border: 1px solid #9fb1bc;
      background: #ffffff;
      color: var(--text);
      border-radius: 6px;
      padding: 10px 14px;
      font-weight: 700;
      cursor: pointer;
    }

    .toggle-button[aria-pressed="true"] {
      border-color: var(--green);
      color: var(--green);
    }

    .toggle-button[aria-pressed="false"] {
      border-color: #b8c5cc;
      color: var(--muted);
    }

    button:hover {
      border-color: var(--blue);
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.55;
    }

    .status-ok {
      color: var(--green);
      font-weight: 700;
    }

    .status-error {
      color: var(--red);
      font-weight: 700;
    }

    .status-running {
      color: var(--amber);
      font-weight: 700;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: var(--panel);
      border: 1px solid var(--line);
    }

    th,
    td {
      padding: 12px 14px;
      border-bottom: 1px solid #e5eaed;
      text-align: right;
      white-space: nowrap;
    }

    th:first-child,
    td:first-child {
      text-align: left;
    }

    th {
      background: #eef3f5;
      font-size: 13px;
    }

    @media (max-width: 980px) {
      .summary-grid,
      .state-grid,
      .flow-grid {
        grid-template-columns: 1fr;
      }

      .flow-visual {
        grid-template-columns: 1fr;
      }

      .flow-route {
        grid-auto-flow: row;
        grid-auto-columns: auto;
        grid-template-columns: 1fr;
      }

      .flow-segment {
        width: 4px;
        height: 22px;
        justify-self: center;
      }

      .flow-segment::after {
        top: auto;
        right: 50%;
        bottom: -1px;
        transform: translateX(50%) rotate(135deg);
      }

      header {
        align-items: flex-start;
        flex-direction: column;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .flow-particle {
        animation: none;
        display: none;
      }
    }
  </style>
</head>
<body>
<main>
  <header>
    <div>
      <h1>좋아요 처리 흐름 대시보드</h1>
      <div class="muted">요청부터 Redis, RabbitMQ, Consumer, DB 반영까지 3초마다 갱신합니다.</div>
    </div>
    <div class="muted" id="updated-at">대기 중</div>
  </header>

  <h2>요청 요약</h2>
  <section class="grid summary-grid" id="summary-grid"></section>

  <h2>시스템 상태</h2>
  <section class="grid state-grid" id="state-grid"></section>

  <h2>처리 흐름</h2>
  <section class="grid flow-grid" id="flow-grid"></section>

  <div class="section-title-row">
    <h2>흐름 애니메이션</h2>
    <button id="animation-toggle" class="toggle-button" type="button">애니메이션 켜짐</button>
  </div>
  <section class="panel flow-visual-grid" id="flow-animation-grid"></section>

  <h2>웹에서 k6 실행</h2>
  <section class="panel">
    <div class="button-row">
      <button data-mode="sync">sync 테스트 실행</button>
      <button data-mode="async-event">async-event 테스트 실행</button>
      <button data-mode="buffered-async">buffered-async 테스트 실행</button>
    </div>
    <div id="load-status" class="muted">실행 대기 중</div>
  </section>

  <h2>최근 k6 결과</h2>
  <table>
    <thead>
    <tr>
      <th>지표</th>
      <th>값</th>
    </tr>
    </thead>
    <tbody id="k6-result-body">
    <tr>
      <td>결과</td>
      <td>아직 결과 없음</td>
    </tr>
    </tbody>
  </table>
</main>

<script>
  const endpointLabels = {
    'sync': 'sync - DB 직접 반영',
    'async-event': 'async-event - 개별 이벤트',
    'buffered-async': 'buffered-async - Redis 누적 반영',
  };

  const flowDefinitions = {
    'sync': [
      ['request.received', '요청 수'],
      ['db.direct.updated', 'DB 직접 업데이트'],
    ],
    'async-event': [
      ['request.received', '요청 수'],
      ['redis.dedup.added', 'Redis 신규 사용자'],
      ['redis.dedup.duplicate', 'Redis 중복 요청'],
      ['redis.display.incremented', 'Redis count 증가'],
      ['rabbit.event.published', 'RabbitMQ 개별 이벤트 발행'],
      ['consumer.event.received', 'Consumer 개별 이벤트 수신'],
      ['db.event.updated', 'DB 1건씩 업데이트'],
    ],
    'buffered-async': [
      ['request.received', '요청 수'],
      ['redis.dedup.added', 'Redis 신규 사용자'],
      ['redis.dedup.duplicate', 'Redis 중복 요청'],
      ['redis.display.incremented', 'Redis display 증가'],
      ['redis.pending.incremented', 'Redis pending 증가'],
      ['scheduler.flush.executed', 'Scheduler flush 횟수'],
      ['scheduler.flush.delta', 'Scheduler flush delta 합계'],
      ['rabbit.aggregate.published', 'RabbitMQ delta 이벤트 발행'],
      ['consumer.aggregate.received', 'Consumer delta 이벤트 수신'],
      ['db.aggregate.updated', 'DB delta 업데이트 합계'],
    ],
  };

  const stateDefinitions = [
    ['databaseLikeCount', 'DB like_count'],
    ['asyncEventRedisCount', '기존 async Redis count'],
    ['bufferedDisplayCount', 'buffered display count'],
    ['bufferedPendingCount', 'buffered pending count'],
    ['eventQueueMessages', 'like.queue 대기'],
    ['aggregateQueueMessages', 'aggregate.queue 대기'],
  ];

  const visualFlowDefinitions = {
    'sync': {
      subtitle: 'DB row lock 기반 즉시 반영',
      rateStep: 'request.received',
      nodes: [
        ['request.received', '요청'],
        ['db.direct.updated', 'DB 업데이트'],
        ['response.estimated', '응답'],
      ],
    },
    'async-event': {
      subtitle: 'Redis 중복 체크 후 개별 이벤트 발행',
      rateStep: 'request.received',
      nodes: [
        ['request.received', '요청'],
        ['redis.dedup.added', 'Redis'],
        ['rabbit.event.published', 'RabbitMQ'],
        ['consumer.event.received', 'Consumer'],
        ['db.event.updated', 'DB'],
      ],
    },
    'buffered-async': {
      subtitle: 'Redis 누적 후 delta 단위 DB 반영',
      rateStep: 'request.received',
      nodes: [
        ['request.received', '요청'],
        ['redis.pending.incremented', 'Redis pending'],
        ['scheduler.flush.delta', 'Scheduler flush'],
        ['rabbit.aggregate.published', 'RabbitMQ'],
        ['consumer.aggregate.received', 'Consumer'],
        ['db.aggregate.updated', 'DB'],
      ],
    },
  };

  const maxParticlesTotal = 140;
  const maxParticlesPerMode = 32;
  const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let animationsEnabled = !reducedMotion;
  let previousFlowSnapshot = null;

  function number(value) {
    if (value === undefined || value === null) {
      return '0';
    }
    return Number(value).toLocaleString();
  }

  function ms(value) {
    return Number(value || 0).toFixed(2);
  }

  function renderSummary(metrics) {
    const grid = document.getElementById('summary-grid');
    grid.innerHTML = '';

    Object.entries(metrics).forEach(([endpoint, value]) => {
      const item = document.createElement('div');
      item.className = 'metric';
      item.innerHTML = `
        <div class="metric-label">${endpointLabels[endpoint] || endpoint}</div>
        <div class="metric-value">${number(value.requests)}</div>
        <div class="muted">성공 ${number(value.successes)} / 실패 ${number(value.failures)} / 평균 ${ms(value.averageDurationMs)}ms</div>
      `;
      grid.appendChild(item);
    });
  }

  function renderState(state) {
    const grid = document.getElementById('state-grid');
    grid.innerHTML = '';

    stateDefinitions.forEach(([key, label]) => {
      const item = document.createElement('div');
      item.className = 'metric';
      item.innerHTML = `
        <div class="metric-label">${label}</div>
        <div class="metric-value">${number(state[key])}</div>
      `;
      grid.appendChild(item);
    });
  }

  function renderFlow(flow) {
    const grid = document.getElementById('flow-grid');
    grid.innerHTML = '';

    Object.entries(flowDefinitions).forEach(([mode, steps]) => {
      const panel = document.createElement('div');
      panel.className = 'panel flow-column';
      const title = document.createElement('h3');
      title.textContent = endpointLabels[mode];
      panel.appendChild(title);

      steps.forEach(([key, label]) => {
        const step = document.createElement('div');
        step.className = 'step';
        step.innerHTML = `
          <div class="step-label">${label}</div>
          <div class="step-value">${number((flow[mode] || {})[key])}</div>
        `;
        panel.appendChild(step);
      });

      grid.appendChild(panel);
    });
  }

  function renderFlowAnimationLayout() {
    const grid = document.getElementById('flow-animation-grid');
    grid.innerHTML = '';

    Object.entries(visualFlowDefinitions).forEach(([mode, definition]) => {
      const visual = document.createElement('div');
      visual.className = 'flow-visual';
      visual.dataset.mode = mode;

      const title = document.createElement('div');
      title.innerHTML = `
        <div class="flow-visual-title">${endpointLabels[mode]}</div>
        <div class="flow-visual-subtitle">${definition.subtitle}</div>
      `;
      visual.appendChild(title);

      const route = document.createElement('div');
      route.className = 'flow-route';

      definition.nodes.forEach(([key, label], index) => {
        const node = document.createElement('div');
        node.className = 'flow-node';
        node.dataset.metricKey = key;
        node.innerHTML = `<strong>${label}</strong><span>0</span>`;
        route.appendChild(node);

        if (index < definition.nodes.length - 1) {
          const segment = document.createElement('div');
          segment.className = 'flow-segment';
          segment.dataset.mode = mode;
          route.appendChild(segment);
        }
      });

      visual.appendChild(route);
      grid.appendChild(visual);
    });
  }

  function renderFlowAnimationValues(flow) {
    document.querySelectorAll('.flow-visual').forEach((visual) => {
      const mode = visual.dataset.mode;
      visual.querySelectorAll('.flow-node').forEach((node) => {
        const key = node.dataset.metricKey;
        const value = key === 'response.estimated'
          ? (flow[mode] || {})['request.received']
          : (flow[mode] || {})[key];
        node.querySelector('span').textContent = number(value);
      });
    });
  }

  function updateFlowAnimation(flow) {
    renderFlowAnimationValues(flow);

    if (!animationsEnabled || document.hidden) {
      previousFlowSnapshot = structuredClone(flow);
      return;
    }

    if (!previousFlowSnapshot) {
      previousFlowSnapshot = structuredClone(flow);
      return;
    }

    Object.entries(visualFlowDefinitions).forEach(([mode, definition]) => {
      const current = (flow[mode] || {})[definition.rateStep] || 0;
      const previous = (previousFlowSnapshot[mode] || {})[definition.rateStep] || 0;
      const delta = Math.max(0, current - previous);
      const sampleCount = particleSampleCount(delta);

      if (sampleCount > 0) {
        spawnFlowParticles(mode, sampleCount);
      }
    });

    previousFlowSnapshot = structuredClone(flow);
  }

  function particleSampleCount(delta) {
    if (delta <= 0) {
      return 0;
    }
    return Math.min(maxParticlesPerMode, Math.max(3, Math.ceil(Math.log10(delta + 1) * 8)));
  }

  function spawnFlowParticles(mode, count) {
    const segments = Array.from(document.querySelectorAll(`.flow-segment[data-mode="${mode}"]`));
    if (segments.length === 0) {
      return;
    }

    const totalActive = document.querySelectorAll('.flow-particle').length;
    const allowedCount = Math.max(0, Math.min(count, maxParticlesTotal - totalActive));
    if (allowedCount === 0) {
      return;
    }

    for (let i = 0; i < allowedCount; i += 1) {
      const routeDelay = i * 75;
      segments.forEach((segment, index) => {
        window.setTimeout(() => spawnParticle(segment, mode), routeDelay + index * 180);
      });
    }
  }

  function spawnParticle(segment, mode) {
    if (!animationsEnabled || document.hidden) {
      return;
    }

    const activeParticles = document.querySelectorAll('.flow-particle').length;
    if (activeParticles >= maxParticlesTotal) {
      return;
    }

    const particle = document.createElement('span');
    particle.className = `flow-particle ${mode}`;
    const isVerticalSegment = segment.clientHeight > segment.clientWidth;
    const travelX = isVerticalSegment ? 0 : Math.max(12, segment.clientWidth - 10);
    const travelY = isVerticalSegment ? Math.max(12, segment.clientHeight - 10) : 0;
    particle.style.setProperty('--travel-x', `${travelX}px`);
    particle.style.setProperty('--travel-y', `${travelY}px`);
    particle.addEventListener('animationend', () => particle.remove(), {once: true});
    segment.appendChild(particle);
  }

  function setAnimationToggleState() {
    const toggle = document.getElementById('animation-toggle');
    toggle.setAttribute('aria-pressed', String(animationsEnabled));
    toggle.textContent = animationsEnabled ? '애니메이션 켜짐' : '애니메이션 꺼짐';
  }

  async function loadDashboard() {
    const [metricsResponse, flowResponse, stateResponse, loadStatusResponse, latestResultResponse] = await Promise.all([
      fetch('/api/v1/like/metrics'),
      fetch('/api/v1/like/flow-metrics'),
      fetch('/api/v1/like/system-state?videoId=1'),
      fetch('/api/v1/load-tests/current'),
      fetch('/api/v1/load-tests/results/latest'),
    ]);

    renderSummary(await metricsResponse.json());
    const flow = await flowResponse.json();
    renderFlow(flow);
    updateFlowAnimation(flow);
    renderState(await stateResponse.json());
    renderLoadStatus(await loadStatusResponse.json());
    renderK6Result(await latestResultResponse.json());

    document.getElementById('updated-at').textContent =
      `마지막 갱신: ${new Date().toLocaleTimeString()}`;
  }

  function renderLoadStatus(status) {
    const target = document.getElementById('load-status');
    const buttons = document.querySelectorAll('button[data-mode]');
    buttons.forEach((button) => button.disabled = Boolean(status.running));

    if (status.running) {
      target.className = 'status-running';
      target.textContent = `${status.mode} 테스트 실행 중`;
      return;
    }

    if (status.errorMessage) {
      target.className = 'status-error';
      target.textContent = status.errorMessage;
      return;
    }

    if (status.mode) {
      target.className = status.exitCode === 0 ? 'status-ok' : 'status-error';
      target.textContent = `${status.mode} 테스트 종료, exitCode=${status.exitCode}`;
      return;
    }

    target.className = 'muted';
    target.textContent = '실행 대기 중';
  }

  function renderK6Result(result) {
    const body = document.getElementById('k6-result-body');
    const metrics = result.metrics || {};
    const rows = [
      ['http_reqs', metrics.http_reqs?.count],
      ['http_req_duration avg(ms)', metrics.http_req_duration?.avg],
      ['http_req_duration p95(ms)', metrics.http_req_duration?.['p(95)']],
      ['http_req_failed rate', metrics.http_req_failed?.rate],
      ['checks rate', metrics.checks?.rate],
    ];

    body.innerHTML = '';
    rows.forEach(([label, value]) => {
      const row = document.createElement('tr');
      row.innerHTML = `<td>${label}</td><td>${value === undefined ? '-' : String(value)}</td>`;
      body.appendChild(row);
    });
  }

  document.querySelectorAll('button[data-mode]').forEach((button) => {
    button.addEventListener('click', async () => {
      await fetch('/api/v1/load-tests/start', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({mode: button.dataset.mode}),
      });
      await loadDashboard();
    });
  });

  document.getElementById('animation-toggle').addEventListener('click', () => {
    animationsEnabled = !animationsEnabled;
    if (!animationsEnabled) {
      document.querySelectorAll('.flow-particle').forEach((particle) => particle.remove());
    }
    setAnimationToggleState();
  });

  document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
      document.querySelectorAll('.flow-particle').forEach((particle) => particle.remove());
    }
  });

  renderFlowAnimationLayout();
  setAnimationToggleState();
  loadDashboard();
  setInterval(loadDashboard, 3000);
</script>
</body>
</html>
