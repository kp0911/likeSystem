<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Like System Dashboard</title>
  <style>
    :root {
      --bg: #f5f7f8;
      --text: #172026;
      --muted: #64727d;
      --line: #d9e1e6;
      --panel: #ffffff;
      --sync: #2563eb;
      --buffered: #0f766e;
      --warn: #b45309;
      --danger: #c92a2a;
      --ok: #087f5b;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, "Malgun Gothic", sans-serif;
      color: var(--text);
      background: var(--bg);
    }

    main {
      max-width: 1180px;
      margin: 0 auto;
      padding: 28px 20px 44px;
    }

    header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 18px;
    }

    h1, h2, h3 {
      margin: 0;
      letter-spacing: 0;
    }

    h1 {
      font-size: 28px;
      line-height: 1.2;
    }

    h2 {
      margin-top: 26px;
      margin-bottom: 12px;
      font-size: 19px;
    }

    h3 {
      font-size: 15px;
    }

    .muted {
      color: var(--muted);
      font-size: 13px;
    }

    .header-copy {
      display: grid;
      gap: 6px;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 8px;
    }

    .test-groups {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      width: min(100%, 620px);
    }

    .test-group {
      display: grid;
      gap: 7px;
      padding-left: 10px;
      border-left: 3px solid var(--line);
    }

    .test-group.sustained {
      border-left-color: var(--sync);
    }

    .test-group.burst {
      border-left-color: var(--warn);
    }

    .test-group-label {
      color: var(--text);
      font-size: 13px;
      font-weight: 700;
    }

    .test-group-label span {
      color: var(--muted);
      font-size: 12px;
      font-weight: 400;
    }

    .group-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    button {
      min-height: 38px;
      border: 1px solid #9fb1bc;
      background: #ffffff;
      color: var(--text);
      border-radius: 6px;
      padding: 9px 13px;
      font-weight: 700;
      cursor: pointer;
    }

    button.primary {
      border-color: #1d4ed8;
      background: #2563eb;
      color: #ffffff;
    }

    button.buffered {
      border-color: #0f766e;
      background: #0f766e;
      color: #ffffff;
    }

    button.burst {
      border-color: #b45309;
      background: #b45309;
      color: #ffffff;
    }

    button.danger {
      border-color: #c92a2a;
      background: #ffffff;
      color: #c92a2a;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.55;
    }

    .grid {
      display: grid;
      gap: 12px;
    }

    .two {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .four {
      grid-template-columns: repeat(4, minmax(0, 1fr));
    }

    .panel,
    .metric,
    .step {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 6px;
    }

    .panel {
      padding: 16px;
    }

    .metric {
      min-height: 92px;
      padding: 14px;
      transition: border-color 180ms ease, box-shadow 180ms ease, transform 180ms ease;
    }

    .metric.changed {
      border-color: #0f766e;
      box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.14);
      transform: translateY(-1px);
    }

    .label {
      margin-bottom: 8px;
      color: var(--muted);
      font-size: 12px;
    }

    .value {
      font-size: 24px;
      font-weight: 700;
      line-height: 1.1;
    }

    .subvalue {
      margin-top: 8px;
      color: var(--muted);
      font-size: 13px;
    }

    .status-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .status-text {
      display: flex;
      align-items: center;
      min-height: 38px;
      gap: 10px;
      font-weight: 700;
    }

    .status-text.idle {
      color: var(--muted);
    }

    .status-text.running {
      color: var(--warn);
    }

    .status-text.ok {
      color: var(--ok);
    }

    .status-text.error {
      color: var(--danger);
    }

    .spinner {
      width: 18px;
      height: 18px;
      border: 3px solid #f1d6a8;
      border-top-color: var(--warn);
      border-radius: 50%;
      animation: spin 800ms linear infinite;
    }

    .activity {
      height: 10px;
      margin-top: 14px;
      overflow: hidden;
      border-radius: 999px;
      background: #e7edf1;
    }

    .activity-bar {
      width: 35%;
      height: 100%;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--sync), var(--buffered));
      transform: translateX(-110%);
    }

    .activity.running .activity-bar {
      animation: sweep 1100ms ease-in-out infinite;
    }

    .flow-column {
      display: flex;
      flex-direction: column;
      gap: 8px;
      position: relative;
      overflow: hidden;
    }

    .flow-column::before {
      content: "";
      position: absolute;
      left: 24px;
      top: 52px;
      bottom: 16px;
      width: 2px;
      background: #d9e1e6;
    }

    .flow-column.running::after {
      content: "";
      position: absolute;
      left: 20px;
      top: 52px;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: currentColor;
      animation: flowPulse 1800ms linear infinite;
    }

    .flow-column.sync {
      color: var(--sync);
    }

    .flow-column.buffered-async {
      color: var(--buffered);
    }

    .step {
      position: relative;
      min-height: 72px;
      padding: 12px 12px 12px 36px;
      color: var(--text);
    }

    .step::before {
      content: "";
      position: absolute;
      left: 18px;
      top: 20px;
      width: 10px;
      height: 10px;
      border: 2px solid currentColor;
      border-radius: 50%;
      background: #ffffff;
    }

    .step.active {
      border-color: currentColor;
      box-shadow: 0 0 0 3px color-mix(in srgb, currentColor 16%, transparent);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: #ffffff;
      border: 1px solid var(--line);
    }

    th,
    td {
      padding: 12px 14px;
      border-bottom: 1px solid #e7ecef;
      text-align: right;
      white-space: nowrap;
    }

    th:first-child,
    td:first-child {
      text-align: left;
    }

    th {
      background: #eef3f5;
      font-size: 13px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes sweep {
      0% {
        transform: translateX(-110%);
      }
      100% {
        transform: translateX(300%);
      }
    }

    @keyframes flowPulse {
      0% {
        top: 52px;
        opacity: 0;
      }
      10% {
        opacity: 1;
      }
      90% {
        opacity: 1;
      }
      100% {
        top: calc(100% - 26px);
        opacity: 0;
      }
    }

    @media (max-width: 860px) {
      header,
      .status-row {
        align-items: flex-start;
        flex-direction: column;
      }

      .toolbar {
        justify-content: flex-start;
      }

      .test-groups {
        grid-template-columns: 1fr;
      }

      .two,
      .four {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
<main>
  <header>
    <div class="header-copy">
      <h1>좋아요 처리 테스트 대시보드</h1>
      <div class="muted">sync와 buffered-async의 요청, Redis, RabbitMQ, DB 반영 상태를 확인합니다.</div>
    </div>
    <div class="muted" id="updated-at">대기 중</div>
  </header>

  <section class="panel">
    <div class="status-row">
      <div>
        <div id="load-status" class="status-text idle">실행 대기 중</div>
        <div id="load-plan" class="muted">대시보드에서 실행하는 테스트는 app 컨테이너 내부의 k6를 사용합니다.</div>
      </div>
      <div class="toolbar">
        <div class="test-groups">
          <div class="test-group sustained">
            <div class="test-group-label">지속 동시 부하 <span>500 VU · 5분 반복 요청</span></div>
            <div class="group-actions">
              <button class="primary" data-mode="sync">sync 실행</button>
              <button class="buffered" data-mode="buffered-async">buffered 실행</button>
            </div>
          </div>
          <div class="test-group burst">
            <div class="test-group-label">순간 버스트 부하 <span>500 VU · VU당 1회 요청</span></div>
            <div class="group-actions">
              <button class="burst" data-mode="burst-sync">sync 실행</button>
              <button class="burst" data-mode="burst-buffered-async">buffered 실행</button>
            </div>
          </div>
        </div>
        <button class="danger" id="stop-test">테스트 중지</button>
        <button id="reset-state">DB/Redis/Queue 초기화</button>
      </div>
    </div>
    <div id="activity" class="activity">
      <div class="activity-bar"></div>
    </div>
  </section>

  <h2>요청 요약</h2>
  <section class="grid two" id="summary-grid"></section>

  <h2>시스템 상태</h2>
  <section class="grid four" id="state-grid"></section>

  <h2>처리 흐름</h2>
  <section class="grid two" id="flow-grid"></section>

  <h2>최근 k6 결과</h2>
  <table>
    <thead>
    <tr>
      <th>지표</th>
      <th>값</th>
    </tr>
    </thead>
    <tbody id="k6-result-body">
    <tr>
      <td>결과</td>
      <td>아직 결과 없음</td>
    </tr>
    </tbody>
  </table>
</main>

<script>
  const endpointLabels = {
    'sync': 'sync - DB 직접 반영',
    'buffered-async': 'buffered-async - Redis 누적 후 일괄 반영',
  };

  const loadTestDefinitions = {
    'sync': {
      label: '지속 sync',
      endpoint: 'sync',
      plan: '지속 동시 부하: 500 VU가 5분 동안 요청과 0.1초 대기를 반복합니다.',
    },
    'buffered-async': {
      label: '지속 buffered-async',
      endpoint: 'buffered-async',
      plan: '지속 동시 부하: 500 VU가 5분 동안 요청과 0.1초 대기를 반복합니다.',
    },
    'burst-sync': {
      label: '순간 버스트 sync',
      endpoint: 'sync',
      plan: '순간 버스트: 500 VU가 대기 없이 요청을 한 번씩 집중 전송합니다.',
    },
    'burst-buffered-async': {
      label: '순간 버스트 buffered-async',
      endpoint: 'buffered-async',
      plan: '순간 버스트: 500 VU가 대기 없이 요청을 한 번씩 집중 전송합니다.',
    },
  };

  const flowDefinitions = {
    'sync': [
      ['request.received', '요청 수신'],
      ['db.direct.updated', 'DB 직접 업데이트'],
    ],
    'buffered-async': [
      ['request.received', '요청 수신'],
      ['redis.dedup.added', 'Redis 신규 사용자 기록'],
      ['redis.dedup.duplicate', 'Redis 중복 요청 감지'],
      ['redis.display.incremented', 'Redis 표시용 카운트 증가'],
      ['redis.pending.incremented', 'Redis pending 카운트 증가'],
      ['scheduler.flush.executed', 'Scheduler flush 실행'],
      ['scheduler.flush.delta', 'Scheduler delta 합계'],
      ['rabbit.aggregate.published', 'RabbitMQ delta 발행'],
      ['consumer.aggregate.received', 'Consumer delta 수신'],
      ['db.aggregate.updated', 'DB delta 업데이트'],
    ],
  };

  const stateDefinitions = [
    ['databaseLikeCount', 'DB like_count'],
    ['bufferedDisplayCount', 'Redis display count'],
    ['bufferedPendingCount', 'Redis pending count'],
    ['aggregateQueueMessages', 'RabbitMQ 대기 메시지'],
  ];

  const previousValues = new Map();
  let currentLoadStatus = {running: false};

  function number(value) {
    return Number(value || 0).toLocaleString();
  }

  function ms(value) {
    return Number(value || 0).toFixed(2);
  }

  function changed(key, value) {
    const normalized = String(value ?? '');
    const was = previousValues.get(key);
    previousValues.set(key, normalized);
    return was !== undefined && was !== normalized;
  }

  function renderSummary(metrics) {
    const grid = document.getElementById('summary-grid');
    grid.innerHTML = '';

    Object.entries(endpointLabels).forEach(([endpoint, label]) => {
      const value = metrics[endpoint] || {};
      const key = `summary:${endpoint}`;
      const composite = `${value.requests}:${value.successes}:${value.failures}:${value.averageDurationMs}`;
      const item = document.createElement('div');
      item.className = `metric ${changed(key, composite) ? 'changed' : ''}`;
      item.innerHTML = `
        <div class="label">${label}</div>
        <div class="value">${number(value.requests)}</div>
        <div class="subvalue">성공 ${number(value.successes)} / 실패 ${number(value.failures)} / 평균 ${ms(value.averageDurationMs)}ms</div>
      `;
      grid.appendChild(item);
    });
  }

  function renderState(state) {
    const grid = document.getElementById('state-grid');
    grid.innerHTML = '';

    stateDefinitions.forEach(([key, label]) => {
      const value = state[key];
      const item = document.createElement('div');
      item.className = `metric ${changed(`state:${key}`, value) ? 'changed' : ''}`;
      item.innerHTML = `
        <div class="label">${label}</div>
        <div class="value">${number(value)}</div>
      `;
      grid.appendChild(item);
    });
  }

  function renderFlow(flow) {
    const grid = document.getElementById('flow-grid');
    grid.innerHTML = '';

    Object.entries(flowDefinitions).forEach(([mode, steps]) => {
      const panel = document.createElement('div');
      const runningDefinition = loadTestDefinitions[currentLoadStatus.mode];
      const isRunningMode = currentLoadStatus.running && runningDefinition?.endpoint === mode;
      panel.className = `panel flow-column ${mode} ${isRunningMode ? 'running' : ''}`;
      panel.innerHTML = `<h3>${endpointLabels[mode]}</h3>`;

      steps.forEach(([key, label]) => {
        const value = (flow[mode] || {})[key] || 0;
        const didChange = changed(`flow:${mode}:${key}`, value);
        const step = document.createElement('div');
        step.className = `step ${didChange ? 'active' : ''}`;
        step.innerHTML = `
          <div class="label">${label}</div>
          <div class="value">${number(value)}</div>
        `;
        panel.appendChild(step);
      });

      grid.appendChild(panel);
    });
  }

  function renderLoadStatus(status) {
    currentLoadStatus = status || {running: false};
    const target = document.getElementById('load-status');
    const activity = document.getElementById('activity');
    const startButtons = document.querySelectorAll('button[data-mode]');
    const stopButton = document.getElementById('stop-test');
    const resetButton = document.getElementById('reset-state');
    const planTarget = document.getElementById('load-plan');
    const definition = loadTestDefinitions[status.mode];

    startButtons.forEach((button) => {
      button.disabled = Boolean(status.running);
    });
    stopButton.disabled = !status.running;
    resetButton.disabled = Boolean(status.running);
    activity.classList.toggle('running', Boolean(status.running));
    planTarget.textContent = definition
      ? definition.plan
      : '대시보드에서 실행하는 테스트는 app 컨테이너 내부의 k6를 사용합니다.';

    if (status.running) {
      target.className = 'status-text running';
      target.innerHTML = `<span class="spinner"></span>${definition?.label || status.mode} 테스트 실행 중`;
      return;
    }

    if (status.errorMessage) {
      target.className = status.stopped ? 'status-text ok' : 'status-text error';
      target.textContent = status.errorMessage;
      return;
    }

    if (status.mode) {
      target.className = status.exitCode === 0 ? 'status-text ok' : 'status-text error';
      target.textContent = `${definition?.label || status.mode} 테스트 종료, exitCode=${status.exitCode}`;
      return;
    }

    target.className = 'status-text idle';
    target.textContent = '실행 대기 중';
  }

  function renderK6Result(result) {
    const body = document.getElementById('k6-result-body');
    const metrics = result.metrics || {};
    const rows = [
      ['http_reqs', metrics.http_reqs?.count],
      ['http_req_duration avg(ms)', metrics.http_req_duration?.avg],
      ['http_req_duration p95(ms)', metrics.http_req_duration?.['p(95)']],
      ['http_req_failed rate', metrics.http_req_failed?.rate],
      ['checks rate', metrics.checks?.rate],
    ];

    body.innerHTML = '';
    rows.forEach(([label, value]) => {
      const row = document.createElement('tr');
      row.innerHTML = `<td>${label}</td><td>${value === undefined ? '-' : String(value)}</td>`;
      body.appendChild(row);
    });
  }

  async function loadDashboard() {
    const [loadStatusResponse, metricsResponse, flowResponse, stateResponse, latestResultResponse] = await Promise.all([
      fetch('/api/v1/load-tests/current'),
      fetch('/api/v1/like/metrics'),
      fetch('/api/v1/like/flow-metrics'),
      fetch('/api/v1/like/system-state?videoId=1'),
      fetch('/api/v1/load-tests/results/latest'),
    ]);

    renderLoadStatus(await loadStatusResponse.json());
    renderSummary(await metricsResponse.json());
    renderFlow(await flowResponse.json());
    renderState(await stateResponse.json());
    renderK6Result(await latestResultResponse.json());

    document.getElementById('updated-at').textContent =
      `마지막 갱신: ${new Date().toLocaleTimeString()}`;
  }

  async function postJson(url, body) {
    const response = await fetch(url, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: body === undefined ? undefined : JSON.stringify(body),
    });
    if (!response.ok) {
      throw new Error(await response.text());
    }
    return response.json();
  }

  document.querySelectorAll('button[data-mode]').forEach((button) => {
    button.addEventListener('click', async () => {
      await postJson('/api/v1/load-tests/start', {mode: button.dataset.mode});
      await loadDashboard();
    });
  });

  document.getElementById('stop-test').addEventListener('click', async () => {
    await postJson('/api/v1/load-tests/stop');
    await loadDashboard();
  });

  document.getElementById('reset-state').addEventListener('click', async () => {
    const confirmed = window.confirm('video.id=1의 DB 값, Redis 카운트, RabbitMQ 대기 메시지, 대시보드 메트릭을 초기화할까요?');
    if (!confirmed) {
      return;
    }
    await postJson('/api/v1/like/test-state/reset?videoId=1');
    previousValues.clear();
    await loadDashboard();
  });

  loadDashboard();
  setInterval(loadDashboard, 1000);
</script>
</body>
</html>
