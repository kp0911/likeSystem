<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Like System Dashboard</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      color: #172026;
      background: #f4f6f7;
    }

    main {
      max-width: 1120px;
      margin: 0 auto;
      padding: 28px 20px 40px;
    }

    header {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: flex-end;
      margin-bottom: 20px;
    }

    h1 {
      margin: 0 0 6px;
      font-size: 28px;
    }

    h2 {
      margin: 28px 0 12px;
      font-size: 20px;
    }

    .muted {
      color: #62707a;
      font-size: 13px;
    }

    .grid {
      display: grid;
      gap: 12px;
    }

    .two {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .four {
      grid-template-columns: repeat(4, minmax(0, 1fr));
    }

    .panel,
    .metric,
    .step {
      background: #ffffff;
      border: 1px solid #d8e0e4;
      border-radius: 6px;
    }

    .panel {
      padding: 16px;
    }

    .metric {
      padding: 14px;
      min-height: 86px;
    }

    .label {
      color: #62707a;
      font-size: 12px;
      margin-bottom: 8px;
    }

    .value {
      font-size: 24px;
      font-weight: 700;
      line-height: 1.1;
    }

    .flow-column {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .step {
      padding: 12px;
      min-height: 72px;
    }

    button {
      border: 1px solid #9fb1bc;
      background: #ffffff;
      color: #172026;
      border-radius: 6px;
      padding: 10px 14px;
      font-weight: 700;
      cursor: pointer;
      margin-right: 8px;
      margin-bottom: 8px;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.55;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: #ffffff;
      border: 1px solid #d8e0e4;
    }

    th,
    td {
      padding: 12px 14px;
      border-bottom: 1px solid #e5eaed;
      text-align: right;
      white-space: nowrap;
    }

    th:first-child,
    td:first-child {
      text-align: left;
    }

    th {
      background: #eef3f5;
      font-size: 13px;
    }

    .ok {
      color: #087f5b;
      font-weight: 700;
    }

    .running {
      color: #9a6700;
      font-weight: 700;
    }

    .error {
      color: #c92a2a;
      font-weight: 700;
    }

    @media (max-width: 840px) {
      header {
        align-items: flex-start;
        flex-direction: column;
      }

      .two,
      .four {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
<main>
  <header>
    <div>
      <h1>좋아요 처리 대시보드</h1>
      <div class="muted">sync와 buffered-async의 요청, Redis, RabbitMQ, DB 상태를 확인합니다.</div>
    </div>
    <div class="muted" id="updated-at">대기 중</div>
  </header>

  <h2>요청 요약</h2>
  <section class="grid two" id="summary-grid"></section>

  <h2>시스템 상태</h2>
  <section class="grid four" id="state-grid"></section>

  <h2>처리 흐름</h2>
  <section class="grid two" id="flow-grid"></section>

  <h2>내장 k6 실행</h2>
  <section class="panel">
    <button data-mode="sync">sync 테스트 실행</button>
    <button data-mode="buffered-async">buffered-async 테스트 실행</button>
    <div id="load-status" class="muted">실행 대기 중</div>
  </section>

  <h2>최근 k6 결과</h2>
  <table>
    <thead>
    <tr>
      <th>지표</th>
      <th>값</th>
    </tr>
    </thead>
    <tbody id="k6-result-body">
    <tr>
      <td>결과</td>
      <td>아직 결과 없음</td>
    </tr>
    </tbody>
  </table>
</main>

<script>
  const endpointLabels = {
    'sync': 'sync - DB 직접 반영',
    'buffered-async': 'buffered-async - Redis 누적 후 일괄 반영',
  };

  const flowDefinitions = {
    'sync': [
      ['request.received', '요청 수'],
      ['db.direct.updated', 'DB 직접 업데이트'],
    ],
    'buffered-async': [
      ['request.received', '요청 수'],
      ['redis.dedup.added', 'Redis 신규 사용자'],
      ['redis.dedup.duplicate', 'Redis 중복 요청'],
      ['redis.display.incremented', 'Redis display 증가'],
      ['redis.pending.incremented', 'Redis pending 증가'],
      ['scheduler.flush.executed', 'Scheduler flush 횟수'],
      ['scheduler.flush.delta', 'Scheduler flush delta 합계'],
      ['rabbit.aggregate.published', 'RabbitMQ delta 이벤트 발행'],
      ['consumer.aggregate.received', 'Consumer delta 이벤트 수신'],
      ['db.aggregate.updated', 'DB delta 업데이트 합계'],
    ],
  };

  const stateDefinitions = [
    ['databaseLikeCount', 'DB like_count'],
    ['bufferedDisplayCount', 'buffered display count'],
    ['bufferedPendingCount', 'buffered pending count'],
    ['aggregateQueueMessages', 'aggregate.queue 대기'],
  ];

  function number(value) {
    return Number(value || 0).toLocaleString();
  }

  function ms(value) {
    return Number(value || 0).toFixed(2);
  }

  function renderSummary(metrics) {
    const grid = document.getElementById('summary-grid');
    grid.innerHTML = '';

    Object.entries(metrics).forEach(([endpoint, value]) => {
      const item = document.createElement('div');
      item.className = 'metric';
      item.innerHTML = `
        <div class="label">${endpointLabels[endpoint] || endpoint}</div>
        <div class="value">${number(value.requests)}</div>
        <div class="muted">성공 ${number(value.successes)} / 실패 ${number(value.failures)} / 평균 ${ms(value.averageDurationMs)}ms</div>
      `;
      grid.appendChild(item);
    });
  }

  function renderState(state) {
    const grid = document.getElementById('state-grid');
    grid.innerHTML = '';

    stateDefinitions.forEach(([key, label]) => {
      const item = document.createElement('div');
      item.className = 'metric';
      item.innerHTML = `
        <div class="label">${label}</div>
        <div class="value">${number(state[key])}</div>
      `;
      grid.appendChild(item);
    });
  }

  function renderFlow(flow) {
    const grid = document.getElementById('flow-grid');
    grid.innerHTML = '';

    Object.entries(flowDefinitions).forEach(([mode, steps]) => {
      const panel = document.createElement('div');
      panel.className = 'panel flow-column';
      panel.innerHTML = `<h3>${endpointLabels[mode]}</h3>`;

      steps.forEach(([key, label]) => {
        const step = document.createElement('div');
        step.className = 'step';
        step.innerHTML = `
          <div class="label">${label}</div>
          <div class="value">${number((flow[mode] || {})[key])}</div>
        `;
        panel.appendChild(step);
      });

      grid.appendChild(panel);
    });
  }

  function renderLoadStatus(status) {
    const target = document.getElementById('load-status');
    document.querySelectorAll('button[data-mode]').forEach((button) => {
      button.disabled = Boolean(status.running);
    });

    if (status.running) {
      target.className = 'running';
      target.textContent = `${status.mode} 테스트 실행 중`;
      return;
    }

    if (status.errorMessage) {
      target.className = 'error';
      target.textContent = status.errorMessage;
      return;
    }

    if (status.mode) {
      target.className = status.exitCode === 0 ? 'ok' : 'error';
      target.textContent = `${status.mode} 테스트 종료, exitCode=${status.exitCode}`;
      return;
    }

    target.className = 'muted';
    target.textContent = '실행 대기 중';
  }

  function renderK6Result(result) {
    const body = document.getElementById('k6-result-body');
    const metrics = result.metrics || {};
    const rows = [
      ['http_reqs', metrics.http_reqs?.count],
      ['http_req_duration avg(ms)', metrics.http_req_duration?.avg],
      ['http_req_duration p95(ms)', metrics.http_req_duration?.['p(95)']],
      ['http_req_failed rate', metrics.http_req_failed?.rate],
      ['checks rate', metrics.checks?.rate],
    ];

    body.innerHTML = '';
    rows.forEach(([label, value]) => {
      const row = document.createElement('tr');
      row.innerHTML = `<td>${label}</td><td>${value === undefined ? '-' : String(value)}</td>`;
      body.appendChild(row);
    });
  }

  async function loadDashboard() {
    const [metricsResponse, flowResponse, stateResponse, loadStatusResponse, latestResultResponse] = await Promise.all([
      fetch('/api/v1/like/metrics'),
      fetch('/api/v1/like/flow-metrics'),
      fetch('/api/v1/like/system-state?videoId=1'),
      fetch('/api/v1/load-tests/current'),
      fetch('/api/v1/load-tests/results/latest'),
    ]);

    renderSummary(await metricsResponse.json());
    renderFlow(await flowResponse.json());
    renderState(await stateResponse.json());
    renderLoadStatus(await loadStatusResponse.json());
    renderK6Result(await latestResultResponse.json());

    document.getElementById('updated-at').textContent =
      `마지막 갱신: ${new Date().toLocaleTimeString()}`;
  }

  document.querySelectorAll('button[data-mode]').forEach((button) => {
    button.addEventListener('click', async () => {
      await fetch('/api/v1/load-tests/start', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({mode: button.dataset.mode}),
      });
      await loadDashboard();
    });
  });

  loadDashboard();
  setInterval(loadDashboard, 3000);
</script>
</body>
</html>
