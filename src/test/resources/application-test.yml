spring:
  datasource:
    url: jdbc:h2:mem:like_system;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  sql:
    init:
      mode: never
  rabbitmq:
    listener:
      simple:
        auto-startup: false
like:
  buffered:
    flush-enabled: false
