services:
  mariadb:
    image: mariadb:10.11
    container_name: mariadb-container
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: like_system
      MYSQL_USER: db_user
      MYSQL_PASSWORD: db_password
      MYSQL_ROOT_PASSWORD: root_password
    command:
      - --max_connections=200
      - --innodb_buffer_pool_size=256M

  redis:
    image: redis:7.2
    container_name: redis-container
    ports:
      - "6379:6379"
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory
      - 512mb
      - --maxmemory-policy
      - volatile-lru

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: rabbitmq-container
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
